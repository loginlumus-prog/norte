# Como o Norte sobe no Render.
#
# Isto é um "Blueprint": o Render lê este arquivo e monta o serviço sozinho —
# comando de build, comando de start, versão do Node e quais segredos ele
# precisa pedir. Sem isso, cada campo é preenchido na mão numa tela, e um
# errado derruba o deploy com uma mensagem que não diz qual.
#
# ── a pegadinha que derrubou a primeira tentativa ────────────
# O Render põe NODE_ENV=production no ambiente do build. Com isso, um `npm ci`
# normal PULA as devDependencies — e neste projeto o typescript, o tailwind e o
# CLI do prisma moram lá. O build então falha procurando o tailwind, que está
# no package.json, instalado, funcionando no laptop. Daí o `--include=dev`:
# ele manda instalar tudo, independente do NODE_ENV.
#
# ── e por que `prisma generate` aparece aqui ─────────────────
# O Prisma 7 não gera mais o cliente sozinho depois do install. Sem esta linha
# o build passa e o site sobe, mas toda consulta morre em "@prisma/client did
# not initialize yet" — erro que aparece só quando alguém abre uma tela.
#
# ── o banco NÃO nasce daqui ──────────────────────────────────
# O Postgres é o Supabase, que já existe e já está migrado. O Render só roda a
# aplicação. As três credenciais entram como segredo (`sync: false`): o Render
# pergunta uma vez, guarda cifrado, e elas nunca passam por este arquivo — que
# é público, igual ao resto do repositório.

services:
  - type: web
    name: norte
    runtime: node
    plan: free
    # Das regiões do plano grátis, é a mais perto de São Paulo, onde mora o
    # banco. Cada tela faz várias consultas em sequência; o que se ganha aqui
    # em milissegundos aparece na tela como "abriu rápido". Se o Render recusar
    # esta região, trocar por `oregon` (o padrão dele) resolve — fica mais
    # lento, não quebra nada.
    region: virginia
    branch: master
    autoDeploy: true

    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npm run start
    # O Render só manda tráfego para a instância nova depois que este endereço
    # responde 200 — é o que faz o deploy trocar de versão sem ninguém ver.
    healthCheckPath: /saude

    envVars:
      - key: NODE_VERSION
        value: "22"

      # Sem isto o servidor conta o dia em Londres, e a venda das 22h cai no
      # dia seguinte nos relatórios.
      - key: TZ
        value: America/Sao_Paulo

      # O plano grátis é uma máquina pequena e o Supabase grátis tem limite de
      # conexão. Folgado o bastante para uma demonstração, apertado o bastante
      # para não estourar a cota do banco.
      - key: POOL_MAX
        value: "3"

      # ── os três segredos: o Render pede na primeira vez ──
      # Estão no seu .env.producao, nesta ordem. O DATABASE_URL_ADMIN NÃO entra
      # aqui: ele é dono das tabelas e ignora o RLS. Migração é coisa de laptop.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_PORTARIA
        sync: false
      - key: SEGREDO_SESSAO
        sync: false

      # ── o assistente no WhatsApp ─────────────────────────────
      # Sem estas, o sistema inteiro funciona e o assistente fica mudo — a
      # tela dele diz qual falta ("sem chave de IA", "sem canal"...). Nenhuma
      # delas vai para log, nem aparece na tela.
      #
      # A chave da IA (console da Anthropic → API Keys).
      - key: ANTHROPIC_API_KEY
        sync: false
      # A instância do Z-API: o id e o token DA INSTÂNCIA, e o token de
      # segurança DA CONTA (Z-API → Segurança → Client-Token). Uma instância é
      # UM número de WhatsApp: nesta etapa, UMA loja conversa por vez.
      - key: ZAPI_INSTANCIA
        sync: false
      - key: ZAPI_TOKEN
        sync: false
      - key: ZAPI_CLIENT_TOKEN
        sync: false
      # Assina o endereço do webhook de cada empresa. Trocar este valor
      # invalida o endereço de TODAS — cada loja precisa colar o novo no
      # Z-API. Pelo menos 32 caracteres aleatórios (openssl rand -base64 48).
      - key: WEBHOOK_SEGREDO
        sync: false
      # O que o relógio abaixo apresenta para rodar as rotinas. Pelo menos 32
      # caracteres aleatórios, e diferente do de cima: um vazado não abre o
      # outro.
      - key: ROTINAS_SEGREDO
        sync: false

  # ── o relógio do assistente ──────────────────────────────────
  # Relatório das 8h e das 20h, aviso de ruptura, cliente sumido: nada disso
  # acontece se ninguém bater na porta de hora em hora. Este job só faz isso —
  # um POST — e quem decide o que roda em cada hora é o servidor, no fuso de
  # São Paulo. Por isso o horário aqui é "toda hora cheia" em UTC, sem conta
  # de fuso: errar o fuso aqui não mudaria nada.
  #
  # Cron job do Render não tem plano grátis: é cobrado pelo tempo que roda, e
  # um curl de hora em hora fica no mínimo da tabela.
  #
  # O web grátis dorme sem visita; a primeira batida da hora acorda ele, e
  # por isso o curl espera até quase cinco minutos antes de desistir.
  - type: cron
    name: norte-rotinas
    runtime: node
    plan: starter
    region: virginia
    schedule: "0 * * * *"
    buildCommand: echo "sem build — este job só chama o servidor"
    startCommand: >-
      curl -fsS --max-time 290 -X POST
      -H "Authorization: Bearer $ROTINAS_SEGREDO"
      "$NORTE_URL/api/rotinas"
    envVars:
      # O mesmo segredo do web, copiado de lá: um valor só para colar, e os
      # dois nunca ficam diferentes.
      - key: ROTINAS_SEGREDO
        fromService:
          type: web
          name: norte
          envVarKey: ROTINAS_SEGREDO
      # O endereço público do Norte, sem barra no fim
      # (ex.: https://norte.onrender.com).
      - key: NORTE_URL
        sync: false
